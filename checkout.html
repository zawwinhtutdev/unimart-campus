<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Checkout — UniMart</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/checkout.css">
</head>
<body>

<header class="ck-top">
  <a class="ck-brand" href="/">Uni<span>Mart</span></a>
  <span class="ck-secure">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 10V8a5 5 0 0 1 10 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="10.5" rx="2.2" stroke="currentColor" stroke-width="1.8"/></svg>
    Secure checkout
  </span>
  <button class="ck-cur" id="ckCurrency" type="button" aria-label="Change currency">
    <span class="ck-sym" aria-hidden="true">฿</span><span class="ck-code">THB</span>
  </button>
  <a class="ck-back" href="/">← Back to shop</a>
</header>

<main class="ck-main" id="ckMain"></main>

<script src="js/data.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
