name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check every script parses
        run: |
          for f in js/*.js js/vendor/*.js admin/*.js;
          do
            echo "checking $f"
            node --check "$f"
          done
